<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title> 민철권 </title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #12141f;
    color: #f0f0f0;
    font-family: Consolas, "Malgun Gothic", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    justify-content: center;
    gap: 12px;
  }
  h1 { font-size: 22px; letter-spacing: 2px; }
  #wrap { position: relative; width: min(960px, 96vw); }
  canvas {
    width: 100%;
    display: block;
    border: 2px solid #333;
    border-radius: 8px;
    background: #1a1c2e;
  }
  /* 게임 위 오버레이 (로비/대기/오류) */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(10, 10, 18, 0.88);
    border-radius: 8px;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  button {
    font: bold 18px Consolas, monospace;
    padding: 12px 28px;
    border: 0;
    border-radius: 8px;
    background: #4696f0;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #5aa4f5; }
  input {
    font: bold 18px Consolas, monospace;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #555;
    background: #222;
    color: #fff;
    text-transform: uppercase;
    width: 120px;
    text-align: center;
  }
  #share {
    font-size: 14px;
    background: #222;
    padding: 8px 12px;
    border-radius: 6px;
    word-break: break-all;
    max-width: 90%;
  }
  #status { font-size: 16px; color: #aac; }
  #help { font-size: 13px; color: #778; line-height: 1.7; }
  .row { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
<h1> 민철권 </h1>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="overlay">
    <div id="status">서버에 연결하는 중...</div>
    <div id="lobby" style="display:none">
      <div style="display:flex; flex-direction:column; gap:14px; align-items:center">
        <button id="btn-create">방 만들기</button>
        <div class="row">
          <input id="room-input" maxlength="4" placeholder="코드">
          <button id="btn-join">참가</button>
        </div>
      </div>
    </div>
    <div id="share" style="display:none"></div>
    <button id="btn-copy" style="display:none">링크 복사</button>
  </div>
</div>
<div id="help">
  이동 A/D·←→ · 점프 W/↑ · 웅크리기 아래(S/↓) · 공격 F/. · 방어 G// · 앞앞 = 대시 · 뒤뒤 = 백대시<br>
  아래+공격 = 로우킥(앉아 막아야 방어) · 공중+공격 = 점프킥(서서 막아야 방어) · 아래+방어 = 앉아 막기 · ↓앞+공격 = 어퍼컷<br>
  가드 게이지: 계속 막으면 게이지가 닳아 가드가 풀림 · 가드 중 어퍼컷 맞으면 <b>가드브레이크(1초 스턴)</b><br>
  공격+방어 동시(F+G) = 반격기(0.5초 내 맞으면 1.5배 반사 · 헛치면 경직+쿨타임) · R = 재시작
</div>
<!-- ?v= 는 캐시 무효화용 버전. game.js/config.js 를 수정하면 숫자를 올린다. -->
<script src="config.js?v=6"></script>
<script src="game.js?v=6"></script>
</body>
</html>
