# NAS(DSM Container Manager / Portainer)용 스택 정의.
# 이미지는 GitHub Actions 가 main push 마다 빌드해 GHCR 에 올린다 → NAS 는 pull 만 한다.
# (소스에서 직접 빌드하려면 image 줄을 지우고 `build: .` 주석을 풀면 된다.)
services:
  fight-server:
    image: ghcr.io/mincheolj539-dot/fight-server:latest
    # build: .
    container_name: fight-server
    restart: unless-stopped
    ports:
      - "8765:8765"        # 호스트포트:컨테이너포트 (리버스 프록시가 이 포트로 프록시)
    volumes:
      - fight-data:/app/data   # 레이팅 기록 보존 (컨테이너를 지워도 남게)
    environment:
      PORT: "8765"
      DATA_DIR: "/app/data"
      # 내 사이트만 접속 허용 (여러 개는 쉼표로 구분). 미설정 시 모든 origin 허용.
      ALLOWED_ORIGINS: "https://mincheolj539-dot.github.io"

volumes:
  fight-data:
